name: Testnet yield agent
on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  observe-and-act:
    if: vars.CAMPAIGN_WALLET != '' && vars.AGENT_ID != '' && vars.REGISTRATION_AT_UTC != ''
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Observe market and optionally supply free test BNB
        env:
          CAMPAIGN_WALLET: ${{ vars.CAMPAIGN_WALLET }}
          AGENT_ID: ${{ vars.AGENT_ID }}
          REGISTRATION_AT_UTC: ${{ vars.REGISTRATION_AT_UTC }}
          TESTNET_EXECUTOR_PRIVATE_KEY: ${{ secrets.TESTNET_EXECUTOR_PRIVATE_KEY }}
          EXECUTE: "true"
        run: node scripts/run.mjs
      - name: Publish verified evidence
        run: |
          if git diff --quiet -- data/evidence.json; then exit 0; fi
          git config user.name "yield-proof-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/evidence.json
          git commit -m "Record verified testnet lending action"
          git push
