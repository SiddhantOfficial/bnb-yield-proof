name: Observe testnet yield evidence
on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: testnet-evidence
  cancel-in-progress: false
jobs:
  observe:
    if: vars.CAMPAIGN_WALLET != '' && vars.AGENT_ID != '' && vars.REGISTRATION_AT_UTC != ''
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Observe confirmed campaign-wallet lending events
        run: node scripts/observe.mjs
      - name: Probe public agent availability
        id: probe
        continue-on-error: true
        run: node scripts/probe.mjs
      - name: Publish verified evidence
        run: |
          if git diff --quiet -- data/evidence.json data/availability.json; then exit 0; fi
          git config user.name "yield-proof-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/evidence.json data/availability.json
          git commit -m "Refresh confirmed testnet evidence"
          git push
      - name: Report failed availability probe
        if: steps.probe.outcome == 'failure'
        run: exit 1
